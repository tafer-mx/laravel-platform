name: Dispatch Consumer Package Updates

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  dispatch:
    runs-on: ubuntu-latest

    env:
      CONSUMER_REPOS: |
        tafer-mx/villa-palmar-cancun
        tafer-mx/hotel-mousai

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Dispatch consumer repository updates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAFER_PROJECTS_DISPATCH_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          PACKAGE: tafer-mx/laravel-platform
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing required secret: TAFER_PROJECTS_DISPATCH_TOKEN"
            exit 1
          fi

          while IFS= read -r repo; do
            if [ -z "$repo" ]; then
              continue
            fi

            echo "Dispatching $PACKAGE $TAG to $repo"

            curl --fail-with-body -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/dispatches" \
              -d "{\"event_type\":\"tafer-platform-release\",\"client_payload\":{\"package\":\"$PACKAGE\",\"version\":\"$TAG\"}}"
          done <<< "$CONSUMER_REPOS"
