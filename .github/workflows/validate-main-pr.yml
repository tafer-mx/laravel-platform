name: Validate Main PR Source

on:
  pull_request:
    branches: [main]

jobs:
  validate-source:
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "PRs to main are only allowed from dev."
            exit 1
          fi